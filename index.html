<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Resell Planet</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<script src="https://www.paypal.com/sdk/js?client-id=Abqeni29Ax1nQYeBcP8lEUsd__MoahXx8o65tgOoYHe3oJmq80vd7zJQ5cnrLPqdwUutGkpRfLZYPnHz&currency=USD"></script>

<style>
:root{
  --b1:#0ea5e9;
  --b2:#2563eb;
  --b3:#1e3a8a;
  --glow:#38bdf8;
  --bg:#020617;
  --card:#020617ee;
  --text:#e5e7eb;
  --muted:#94a3b8;
  --radius:30px;
}

*{box-sizing:border-box;font-family:Inter}

body{
  margin:0;
  background:
    radial-gradient(circle at 20% 10%, #0ea5e930, transparent 40%),
    radial-gradient(circle at 80% 80%, #2563eb40, transparent 45%),
    var(--bg);
  color:var(--text);
  overflow-x:hidden;
}

/* FLOATING ORBS */
.orb{
  position:fixed;
  width:520px;height:520px;
  background:radial-gradient(circle,var(--glow),transparent 65%);
  filter:blur(130px);
  opacity:.35;
  animation:float 18s infinite alternate ease-in-out;
  z-index:-1;
}
.orb.two{animation-duration:22s;right:-200px;bottom:-200px}
.orb.one{left:-200px;top:-200px}

@keyframes float{
  from{transform:translateY(0)}
  to{transform:translateY(80px)}
}

/* HEADER */
header{
  padding:28px 60px;
  display:flex;
  justify-content:space-between;
  align-items:center;
}
header img{height:44px}
.stats{
  display:flex;
  gap:30px;
  font-size:13px;
}
.stat span{
  display:block;
  font-weight:900;
  font-size:18px;
  color:#7dd3fc;
}

/* HERO */
.hero{
  max-width:1200px;
  margin:100px auto 80px;
  text-align:center;
}
.hero h1{
  font-size:64px;
  font-weight:900;
}
.hero h1 span{
  background:linear-gradient(90deg,var(--b1),var(--b2));
  -webkit-background-clip:text;
  color:transparent;
}
.hero p{
  max-width:650px;
  margin:20px auto 40px;
  color:var(--muted);
}
.hero button{
  padding:18px 50px;
  border:none;
  border-radius:999px;
  background:linear-gradient(135deg,var(--b1),var(--b2));
  color:#fff;
  font-weight:800;
  cursor:pointer;
  transition:.4s;
}
.hero button:hover{
  transform:translateY(-5px) scale(1.05);
  box-shadow:0 30px 100px rgba(56,189,248,.6);
}

/* LIVE FEED */
.feed{
  position:fixed;
  bottom:30px;
  left:30px;
  background:var(--card);
  border:1px solid #1e293b;
  padding:14px 18px;
  border-radius:16px;
  font-size:13px;
  opacity:0;
  animation:feed 8s infinite;
}
@keyframes feed{
  0%,100%{opacity:0;transform:translateY(10px)}
  10%,80%{opacity:1;transform:translateY(0)}
}

/* TABS */
.tabs{
  display:flex;
  justify-content:center;
  gap:16px;
  margin:80px 0 50px;
}
.tab{
  padding:14px 30px;
  border-radius:999px;
  border:1px solid #1e293b;
  color:var(--muted);
  cursor:pointer;
  transition:.35s;
}
.tab.active{
  background:linear-gradient(135deg,var(--b1),var(--b2));
  color:#fff;
  box-shadow:0 20px 60px rgba(56,189,248,.4);
}

/* STORE */
.store{
  max-width:1400px;
  margin:0 auto 160px;
  padding:0 24px;
}
.grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(320px,1fr));
  gap:60px;
}

/* CARD */
.card{
  background:linear-gradient(180deg,#020617ee,#020617aa);
  border-radius:var(--radius);
  padding:18px;
  border:1px solid #1e293b;
  transition:.6s;
  transform-style:preserve-3d;
}
.card:hover{
  transform:translateY(-20px) rotateX(4deg);
  box-shadow:0 60px 160px rgba(56,189,248,.35);
}

.card-img{
  border-radius:24px;
  overflow:hidden;
}
.card-img img{
  width:100%;
  transition:.7s;
}
.card:hover img{transform:scale(1.2)}

.info{
  padding:20px 6px;
}
.price{
  font-weight:900;
  color:#7dd3fc;
}
.stock{
  height:6px;
  background:#020617;
  border-radius:999px;
  overflow:hidden;
  margin:10px 0;
}
.stock span{
  display:block;
  height:100%;
  width:70%;
  background:linear-gradient(90deg,var(--b1),var(--b2));
  animation:stock 2s ease;
}
@keyframes stock{from{width:0}}

.paypal{margin-top:14px;opacity:0;transform:translateY(10px);transition:.4s}
.card:hover .paypal{opacity:1;transform:none}

footer{
  text-align:center;
  padding:50px;
  color:var(--muted);
  font-size:13px;
}
</style>
</head>
<body>

<div class="orb one"></div>
<div class="orb two"></div>

<header>
  <img src="assets/logo.png">
  <div class="stats">
    <div class="stat"><span id="users">128</span>Online</div>
    <div class="stat"><span>£4.2k</span>Today</div>
    <div class="stat"><span>27</span>Vendors</div>
  </div>
</header>

<section class="hero">
  <h1>Welcome to <span>Resell Planet</span></h1>
  <p>The most advanced reselling marketplace. Live vendors. Instant access. Secure checkout.</p>
  <button onclick="document.querySelector('.tabs').scrollIntoView({behavior:'smooth'})">Enter Store</button>
</section>

<div class="tabs">
  <div class="tab active">Vendors</div>
  <div class="tab">Bundles</div>
  <div class="tab">Courses</div>
</div>

<section class="store">
  <div class="grid">
    <div class="card">
      <div class="card-img"><img src="assets/p1.png"></div>
      <div class="info">
        <h3>Fairpods Vendor</h3>
        <div class="price">$20.00 USD</div>
        <div class="stock"><span></span></div>
        <div class="paypal" id="pp1"></div>
      </div>
    </div>
  </div>
</section>

<div class="feed">💸 Someone just bought Fairpods Vendor</div>

<footer>
  © 2026 Resell Planet — PayPal Secured
</footer>

<script>
paypal.Buttons({
  style:{shape:"pill"},
  createOrder:(d,a)=>a.order.create({
    purchase_units:[{amount:{value:"20"}}]
  }),
  onApprove:(d,a)=>a.order.capture().then(()=>alert("Payment successful"))
}).render("#pp1");

setInterval(()=>{
 document.getElementById("users").innerText=
  120+Math.floor(Math.random()*20);
},3000);
</script>

</body>
</html>
