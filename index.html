<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Resell Planet</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<!-- PAYPAL (CREDIT / DEBIT ENABLED) -->
<script src="https://www.paypal.com/sdk/js?client-id=Abqeni29Ax1nQYeBcP8lEUsd__MoahXx8o65tgOoYHe3oJmq80vd7zJQ5cnrLPqdwUutGkpRfLZYPnHz&currency=USD&enable-funding=card"></script>

<style>
:root{
 --bg:#040b1c;
 --panel:#07122d;
 --card:#0a1a3c;
 --border:#12255c;
 --blue:#4f8cff;
 --blue-soft:#7aa2ff;
 --text:#e6ecff;
 --muted:#9fb2ff;
 --radius-xl:28px;
 --radius-lg:22px;
 --radius-md:16px;
}

*{box-sizing:border-box;font-family:Inter}

body{
 margin:0;
 background:
 radial-gradient(circle at 20% 10%, #1e40af55, transparent 40%),
 radial-gradient(circle at 80% 80%, #2563eb40, transparent 45%),
 var(--bg);
 color:var(--text);
}

/* HEADER */
header{
 padding:22px 40px;
 display:flex;
 justify-content:space-between;
 align-items:center;
 background:rgba(4,11,28,.7);
 backdrop-filter:blur(14px);
 border-bottom:1px solid var(--border);
 position:sticky;
 top:0;
 z-index:10;
}
header img{height:34px}
nav span{
 margin-left:26px;
 font-size:14px;
 font-weight:600;
 color:var(--muted);
 cursor:pointer;
}
nav span:hover{color:white}

/* HERO */
.hero{
 max-width:1100px;
 margin:80px auto 60px;
 padding:0 24px;
 text-align:center;
}
.hero h1{
 font-size:52px;
 font-weight:800;
 line-height:1.1;
}
.hero span{
 background:linear-gradient(90deg,var(--blue),var(--blue-soft));
 -webkit-background-clip:text;
 color:transparent;
}
.hero p{
 margin-top:16px;
 font-size:16px;
 color:var(--muted);
}

/* TABS */
.tabs{
 display:flex;
 justify-content:center;
 gap:12px;
 margin:40px 0;
}
.tab{
 padding:12px 26px;
 border-radius:999px;
 font-size:13px;
 font-weight:700;
 color:var(--muted);
 background:var(--panel);
 border:1px solid var(--border);
 cursor:pointer;
 transition:.25s;
}
.tab.active{
 background:linear-gradient(135deg,var(--blue),var(--blue-soft));
 color:white;
 border:none;
 box-shadow:0 15px 50px #4f8cff55;
}

/* STORE */
.store{
 max-width:1200px;
 margin:0 auto 120px;
 padding:0 24px;
}
.grid{
 display:grid;
 grid-template-columns:repeat(auto-fill,minmax(240px,1fr));
 gap:26px;
}

/* PRODUCT CARD */
.product{
 background:linear-gradient(180deg,#0a1a3c,#07122d);
 border-radius:var(--radius-xl);
 padding:14px;
 border:1px solid var(--border);
 cursor:pointer;
 transition:.3s;
}
.product:hover{
 transform:translateY(-6px);
 box-shadow:0 30px 90px #4f8cff40;
 border-color:var(--blue);
}
.product img{
 width:100%;
 border-radius:var(--radius-lg);
 margin-bottom:12px;
}
.product h3{
 margin:0;
 font-size:14px;
 font-weight:700;
}
.product p{
 margin:6px 0 0;
 font-size:13px;
 color:var(--muted);
}
.price{
 margin-top:10px;
 font-weight:800;
 color:#a5bfff;
}

/* CHECKOUT PANEL */
.checkout{
 position:fixed;
 right:-420px;
 top:0;
 width:420px;
 height:100%;
 background:linear-gradient(180deg,#07122d,#040b1c);
 border-left:1px solid var(--border);
 padding:26px;
 transition:.35s;
 z-index:20;
 border-top-left-radius:32px;
 border-bottom-left-radius:32px;
}
.checkout.active{right:0}
.checkout h2{
 margin:0 0 8px;
}
.checkout .close{
 position:absolute;
 top:18px;
 right:22px;
 cursor:pointer;
 color:var(--muted);
 font-size:18px;
}
.paypal{
 margin-top:20px;
}

/* OVERLAY */
.overlay{
 position:fixed;
 inset:0;
 background:#020617cc;
 opacity:0;
 pointer-events:none;
 transition:.3s;
}
.overlay.active{
 opacity:1;
 pointer-events:auto;
}

/* FOOTER */
footer{
 text-align:center;
 padding:50px;
 font-size:12px;
 color:var(--muted);
 border-top:1px solid var(--border);
}
</style>
</head>
<body>

<header>
 <img src="assets/logo.png">
 <nav>
  <span>Store</span>
  <span>Discord</span>
  <span>Support</span>
 </nav>
</header>

<section class="hero">
 <h1>Welcome to <span>Resell Planet</span></h1>
 <p>Premium vendors · instant delivery · secure card payments</p>
</section>

<div class="tabs">
 <div class="tab active" data-tab="vendors">Vendors</div>
 <div class="tab" data-tab="bundles">Bundles</div>
 <div class="tab" data-tab="courses">Courses</div>
</div>

<section class="store">
 <div class="grid" id="grid"></div>
</section>

<div class="overlay" id="overlay"></div>

<div class="checkout" id="checkout">
 <div class="close" onclick="closeCheckout()">✕</div>
 <h2 id="cName"></h2>
 <p style="color:var(--muted)">Secure checkout · Credit or Debit Card</p>
 <div class="price" id="cPrice"></div>
 <div class="paypal" id="paypal"></div>
</div>

<footer>
 © 2026 Resell Planet · PayPal & Credit/Debit Cards
</footer>

<script>
const data={
 vendors:[
  {name:"Fairpods Vendor",price:20,img:"assets/p1.png"},
  {name:"Spyder Vendor",price:10,img:"assets/p2.png"},
  {name:"Cologne Vendor",price:10,img:"assets/p3.png"}
 ],
 bundles:[
  {name:"Beginner Resell Bundle",price:35,img:"assets/p1.png"},
  {name:"Advanced Vendor Pack",price:60,img:"assets/p2.png"}
 ],
 courses:[
  {name:"Reselling From £0",price:15,img:"assets/p3.png"},
  {name:"Scale To £5K/Month",price:25,img:"assets/p1.png"}
 ]
};

const grid=document.getElementById("grid");
const checkout=document.getElementById("checkout");
const overlay=document.getElementById("overlay");

function load(tab){
 grid.innerHTML="";
 data[tab].forEach(p=>{
  const d=document.createElement("div");
  d.className="product";
  d.innerHTML=`
   <img src="${p.img}">
   <h3>${p.name}</h3>
   <p>Instant delivery</p>
   <div class="price">$${p.price}</div>
  `;
  d.onclick=()=>openCheckout(p);
  grid.appendChild(d);
 });
}

function openCheckout(p){
 checkout.classList.add("active");
 overlay.classList.add("active");
 document.getElementById("cName").innerText=p.name;
 document.getElementById("cPrice").innerText="$"+p.price;
 document.getElementById("paypal").innerHTML="";

 paypal.Buttons({
  style:{layout:"vertical",shape:"pill"},
  createOrder:(d,a)=>a.order.create({
   purchase_units:[{amount:{value:p.price.toString()}}]
  }),
  onApprove:(d,a)=>a.order.capture().then(()=>{
   alert("Payment successful!");
   closeCheckout();
  })
 }).render("#paypal");
}

function closeCheckout(){
 checkout.classList.remove("active");
 overlay.classList.remove("active");
}

load("vendors");

document.querySelectorAll(".tab").forEach(t=>{
 t.onclick=()=>{
  document.querySelector(".tab.active").classList.remove("active");
  t.classList.add("active");
  load(t.dataset.tab);
 };
});
</script>

</body>
</html>
