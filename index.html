<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Resell Planet</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<script src="https://www.paypal.com/sdk/js?client-id=Abqeni29Ax1nQYeBcP8lEUsd__MoahXx8o65tgOoYHe3oJmq80vd7zJQ5cnrLPqdwUutGkpRfLZYPnHz&currency=USD&enable-funding=card"></script>

<style>
:root{
 --bg:#020617;
 --card:#020617f0;
 --border:#1e293b;
 --blue:#38bdf8;
 --blue2:#2563eb;
 --text:#e5e7eb;
 --muted:#94a3b8;
 --radius:18px;
}

*{box-sizing:border-box;font-family:Inter}

body{
 margin:0;
 background:linear-gradient(180deg,#020617,#020617 60%,#020617);
 color:var(--text);
}

/* HEADER */
header{
 padding:18px 36px;
 display:flex;
 justify-content:space-between;
 align-items:center;
 border-bottom:1px solid var(--border);
}
header img{height:34px}
nav span{
 margin-left:22px;
 font-weight:600;
 font-size:14px;
 color:var(--muted);
 cursor:pointer;
}
nav span:hover{color:white}

/* HERO */
.hero{
 max-width:900px;
 margin:70px auto 60px;
 text-align:center;
 padding:0 20px;
}
.hero h1{
 font-size:42px;
 font-weight:800;
 margin-bottom:14px;
}
.hero span{
 background:linear-gradient(90deg,var(--blue),var(--blue2));
 -webkit-background-clip:text;
 color:transparent;
}
.hero p{
 font-size:15px;
 color:var(--muted);
}

/* TABS */
.tabs{
 display:flex;
 justify-content:center;
 gap:10px;
 margin-bottom:40px;
}
.tab{
 padding:10px 22px;
 border-radius:999px;
 font-size:13px;
 font-weight:700;
 color:var(--muted);
 border:1px solid var(--border);
 background:#020617;
 cursor:pointer;
 transition:.25s;
}
.tab.active{
 background:linear-gradient(135deg,var(--blue),var(--blue2));
 color:white;
 border:none;
}

/* STORE */
.store{
 max-width:1200px;
 margin:0 auto 120px;
 padding:0 24px;
}
.grid{
 display:grid;
 grid-template-columns:repeat(auto-fill,minmax(220px,1fr));
 gap:22px;
}

/* CARD (SMALL) */
.card{
 background:var(--card);
 border:1px solid var(--border);
 border-radius:var(--radius);
 padding:10px;
 transition:.3s;
 opacity:0;
 transform:translateY(20px);
}
.card.show{
 opacity:1;
 transform:translateY(0);
}
.card:hover{
 border-color:var(--blue);
}

/* IMAGE */
.card-img{
 border-radius:12px;
 overflow:hidden;
 position:relative;
}
.card-img img{
 width:100%;
 display:block;
}
.badge{
 position:absolute;
 top:8px;
 left:8px;
 padding:4px 10px;
 font-size:10px;
 font-weight:800;
 background:#020617;
 border:1px solid var(--blue);
 color:#7dd3fc;
 border-radius:999px;
}

/* INFO */
.info{
 padding:10px 4px 4px;
}
.info h3{
 margin:0 0 6px;
 font-size:13px;
 font-weight:700;
}
.price{
 font-size:14px;
 font-weight:800;
 color:#7dd3fc;
}
.price del{
 color:#64748b;
 margin-right:6px;
 font-size:12px;
}

/* PAYPAL SMALL */
.paypal{
 margin-top:8px;
 transform:scale(.85);
 transform-origin:left;
}

/* FOOTER */
footer{
 text-align:center;
 padding:40px;
 font-size:12px;
 color:var(--muted);
 border-top:1px solid var(--border);
}
</style>
</head>
<body>

<header>
 <img src="assets/logo.png">
 <nav>
  <span>Store</span>
  <span>Discord</span>
  <span>Support</span>
 </nav>
</header>

<section class="hero">
 <h1>Welcome to <span>Resell Planet</span></h1>
 <p>Compact. Clean. Secure card payments.</p>
</section>

<div class="tabs">
 <div class="tab active" data-tab="vendors">Vendors</div>
 <div class="tab" data-tab="bundles">Bundles</div>
 <div class="tab" data-tab="courses">Courses</div>
</div>

<section class="store">
 <div class="grid" id="grid"></div>
</section>

<footer>
 © 2026 Resell Planet · PayPal & Credit/Debit Cards
</footer>

<script>
const data={
 vendors:[
  {name:"Fairpods Vendor",price:20,old:135,img:"assets/p1.png",badge:"BEST"},
  {name:"Spyder Vendor",price:10,img:"assets/p2.png"},
  {name:"Fairpod Maxes",price:10,img:"assets/p3.png"},
  {name:"Cologne Vendor",price:10,img:"assets/p4.png"}
 ],
 bundles:[
  {name:"Beginner Resell Bundle",price:35,old:80,img:"assets/p1.png"},
  {name:"Advanced Vendor Pack",price:60,img:"assets/p2.png"}
 ],
 courses:[
  {name:"Reselling From £0",price:15,img:"assets/p3.png"},
  {name:"Scale To £5K/Month",price:25,img:"assets/p4.png"}
 ]
};

const grid=document.getElementById("grid");

function load(tab){
 grid.innerHTML="";
 data[tab].forEach((p,i)=>{
  const c=document.createElement("div");
  c.className="card";
  c.innerHTML=`
   <div class="card-img">
    <img src="${p.img}">
    ${p.badge?`<div class="badge">${p.badge}</div>`:""}
   </div>
   <div class="info">
    <h3>${p.name}</h3>
    <div class="price">${p.old?`<del>$${p.old}</del>`:""}$${p.price}</div>
    <div class="paypal" id="pp${i}"></div>
   </div>`;
  grid.appendChild(c);

  setTimeout(()=>c.classList.add("show"),i*80);

  paypal.Buttons({
   style:{layout:"horizontal",height:32,shape:"pill"},
   createOrder:(d,a)=>a.order.create({
    purchase_units:[{amount:{value:p.price.toString()}}]
   }),
   onApprove:(d,a)=>a.order.capture().then(()=>alert("Payment successful"))
  }).render(`#pp${i}`);
 });
}

load("vendors");

document.querySelectorAll(".tab").forEach(t=>{
 t.onclick=()=>{
  document.querySelector(".tab.active").classList.remove("active");
  t.classList.add("active");
  load(t.dataset.tab);
 };
});
</script>

</body>
</html>
